name: Verifica funzioni operative Home Care

on:
  push:
    branches:
      - fix/mobile-operations-notifications-pwa
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: home-care-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homecare
          POSTGRES_PASSWORD: homecare
          POSTGRES_DB: homecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecare -d homecare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 31337
      APP_URL: http://127.0.0.1:31337
      DATABASE_URL: postgresql://homecare:homecare@127.0.0.1:5432/homecare_test
      JWT_SECRET: home-care-operations-test-secret-with-more-than-thirty-two-characters
      ADMIN_NAME: Admin Operations Test
      ADMIN_EMAIL: admin-operations@example.test
      ADMIN_PASSWORD: Admin-password-Operations-2026!
      RESET_ADMIN_PASSWORD: "false"
      STRIPE_WEBHOOK_SECRET: whsec_operations_test
      REGISTRATION_ENABLED: "true"
      BREVO_API_KEY: ""
      BREVO_SENDER_EMAIL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Applica integrazione idempotente
        run: node scripts/apply-operations-v2.js 2>&1 | tee operations-patch.log

      - name: Salva log integrazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-patch-${{ github.run_id }}
          path: operations-patch.log
          if-no-files-found: warn
          retention-days: 2

      - name: Installa dipendenze e aggiorna lockfile
        run: npm install --ignore-scripts --no-fund

      - name: Controlli sintattici, statici e PWA
        run: npm run check

      - name: Migrazioni e seed idempotenti
        run: |
          npm run migrate
          npm run migrate
          npm run seed
          npm run seed

      - name: Test integrazione, sicurezza e operazioni
        run: npm test

      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high

      - name: Registra i file verificati sul branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f operations-patch.log
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da registrare"
            exit 0
          fi
          git commit -m "Aggiunge gestione operativa, notifiche e installazione PWA"
          git push origin HEAD:fix/mobile-operations-notifications-pwa
