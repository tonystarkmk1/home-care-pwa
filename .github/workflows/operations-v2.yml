name: Home Care CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: home-care-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: homecare
          POSTGRES_PASSWORD: homecare
          POSTGRES_DB: homecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecare -d homecare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 31337
      APP_URL: http://127.0.0.1:31337
      DATABASE_URL: postgresql://homecare:homecare@127.0.0.1:5432/homecare_test
      JWT_SECRET: home-care-ci-secret-with-more-than-thirty-two-characters
      ADMIN_NAME: Admin CI
      ADMIN_EMAIL: admin-ci@example.test
      ADMIN_PASSWORD: Admin-password-CI-2026!
      RESET_ADMIN_PASSWORD: "false"
      STRIPE_WEBHOOK_SECRET: whsec_ci_test
      REGISTRATION_ENABLED: "true"
      BREVO_API_KEY: ""
      BREVO_SENDER_EMAIL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Installa dipendenze
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Controlli sintattici, statici e PWA
        run: npm run check

      - name: Migrazioni e seed idempotenti
        run: |
          npm run migrate
          npm run migrate
          npm run seed
          npm run seed

      - name: Test integrazione e sicurezza
        run: npm test

      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
