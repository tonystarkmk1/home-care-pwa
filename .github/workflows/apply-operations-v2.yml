name: Applica Home Care Guided Checks V2

on:
  push:
    branches:
      - agent/home-care-operations-v2
    paths:
      - 'src/guided-checks-v2.js'
      - 'public/guided-checks-v2.js'
      - 'public/guided-checks-v2.css'
      - 'tests/guided-checks.test.js'
      - 'scripts/apply-guided-checks-v2.js'
      - '.github/workflows/apply-operations-v2.yml'

permissions:
  contents: write

concurrency:
  group: home-care-guided-checks-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homecare
          POSTGRES_PASSWORD: homecare_test
          POSTGRES_DB: homecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecare -d homecare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: 31337
      APP_URL: http://127.0.0.1:31337
      DATABASE_URL: postgresql://homecare:homecare_test@127.0.0.1:5432/homecare_test
      JWT_SECRET: home-care-guided-checks-v2-secret-with-more-than-thirty-two-characters
      ADMIN_NAME: Admin Guided Test
      ADMIN_EMAIL: admin-guided-workflow@example.test
      ADMIN_PASSWORD: Admin-password-Guided-2026!
      RESET_ADMIN_PASSWORD: 'false'
      STRIPE_WEBHOOK_SECRET: whsec_guided_test
      REGISTRATION_ENABLED: 'true'
    steps:
      - name: Scarica il branch
        uses: actions/checkout@v4
        with:
          ref: agent/home-care-operations-v2
          fetch-depth: 0

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Applica i collegamenti e le migrazioni sorgente
        run: node scripts/apply-guided-checks-v2.js

      - name: Aggiorna lockfile e installa
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-fund --no-audit

      - name: Controlli statici e sintattici
        run: npm run check

      - name: Verifica migrazioni e seed idempotenti
        run: |
          npm run migrate
          npm run migrate
          npm run seed
          npm run seed

      - name: Test di integrazione e sicurezza
        run: npm test

      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high

      - name: Registra Guided Checks V2 verificata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ops-bootstrap
          rm -f .github/workflows/apply-operations-v2.yml
          rm -f scripts/apply-guided-checks-v2.js scripts/apply-operations-v2.js scripts/pwa-assets-v42.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Nessuna modifica da registrare'; exit 1; }
          git commit -m 'Aggiunge controlli guidati con bozza e approvazione report'
          git push origin HEAD:agent/home-care-operations-v2
